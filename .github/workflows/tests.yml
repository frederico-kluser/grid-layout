# =============================================================================
# tests — matriz de testes do motor (unit + integração com browser)
#
# Context do required status check: o job agregador `tests-ok` (nome estável).
# ubuntu-latest já traz google-chrome-stable — o motor encontra-o via channel
# `chrome` quando o Chromium do Playwright não está instalado.
# =============================================================================

name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.runtime-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        runtime-version: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.runtime-version }}

      - name: Instalar dependências do motor (locked)
        run: npm ci --ignore-scripts
        working-directory: skills/grid-layout

      - name: Doctor do motor (ambiente + browser)
        run: node scripts/gl.mjs doctor
        working-directory: skills/grid-layout

      - name: Testes (unit + integração)
        run: |
          mkdir -p test-results
          node --test --test-reporter=junit --test-reporter-destination=test-results/junit.xml \
            "tests/unit/*.test.mjs" "tests/integration/*.test.mjs"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b4ffed65e7c58ab209024e8d89c0be58e64b6e64 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}-node${{ matrix.runtime-version }}
          path: test-results/
          retention-days: 14

  # Job agregador: nome ESTÁVEL → pode ser exigido como status check.
  tests-ok:
    name: tests-ok
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any matrix leg failed
        if: needs.test.result != 'success'
        run: |
          echo "::error::Houve pernas da matriz com falha — ver o job 'test'"
          exit 1
      - name: Sumário do run
        run: echo "### tests ✅" >> "$GITHUB_STEP_SUMMARY"
